# Example qMRI-neuropipe configuration for GE native gradient nonlinearity correction.
#
# This workflow has two phases:
# 1. Import DICOMs and enrich DWI JSON sidecars with GE isocenter metadata.
# 2. Run dMRI preprocessing/modeling with the native GE GNL backend.

bids_dir: /path/to/bids/dataset
output_dir: /path/to/output/derivatives
work_dir: /path/to/output/work

participant_label:
  - sub-01

n_cpus: 8
memory_gb: 16.0
skip_existing: true
stop_on_error: false
log_level: INFO
verbose: true

import:
  auto_run: false
  dicom_dir: /path/to/source_dicoms/sub-01/ses-01
  subject: "01"
  session: "01"
  method: dcm2bids
  dcm2bids:
    config_file: /path/to/bids/code/dcm2bids_config.json
  metadata_overrides:
    enabled: false
    stop_on_mismatch: true
    rules:
      - match:
          entities:
            acq: spgr
        metadata:
          FlipAngle: [4, 8, 12, 16]
      - match:
          entities:
            acq: ssfp
        metadata:
          FlipAngle: [10, 20, 30, 40]
          PhaseCycling: [0, 180, 0, 180]
      - match:
          entities:
            acq: afi
        metadata:
          TRRatio: 5.0
  gradient_overrides:
    enabled: false
    require_both: true
    stop_on_mismatch: true
    rules:
      - match:
          entities:
            dir: AP
            run: "01"
        bval: /path/to/correct/AP_run01.bval
        bvec: /path/to/correct/AP_run01.bvec
      - match:
          json_fields:
            PhaseEncodingDirection: i-
            SeriesDescription: dw500_pe0_out
        bval: /path/to/correct/pe0_out.bval
        bvec: /path/to/correct/pe0_out.bvec
  gnl_metadata:
    enabled: true
    manufacturer: GE

dmri:
  preprocessing:
    reorient:
      enabled: true

    distcorr:
      method: topup+drbuddi
      fallback: false
      drbuddi:
        transform_type: SyNOnly
        interpolator: linear
        symmetric_pairwise: true
        pe_axis_constraint: 1.0
        registration_options: {}

    denoising:
      enabled: true
      method: mrtrix

    degibbs:
      enabled: true

    eddy:
      enabled: true
      method: eddy
      options:
        repol: true
        data_is_shelled: true

    bias_correction:
      enabled: true
      method: ants

    coregistration:
      enabled: true
      method: ants
      reference_image: T1w
      options:
        output_resolution: anatomical
        apply_method: native
        transform_type: Rigid
        interpolation: linear

    grad_nonlin:
      enabled: true
      method: native_ge
      coeff_file: /path/to/gw_coils_magnus.dat

    brain_masking:
      enabled: true
      method: mrtrix
      apply_to_final_output: false

  modeling:
    grad_nonlin:
      enabled: true
      method: native_ge
      coeff_file: /path/to/gw_coils_magnus.dat

    tensor:
      enabled: true
      method: dipy
      metrics:
        - fa
        - md
        - rd
        - ad
        - l1
        - l2
        - l3
        - v1
        - v2
        - v3
        - tensor_mrtrix
