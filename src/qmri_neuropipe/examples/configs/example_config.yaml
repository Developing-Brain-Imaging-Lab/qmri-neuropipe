# qmri-neuropipe Configuration File (YAML)
# 
# This file demonstrates all available configuration options.
# Required fields: bids_dir, output_dir
# All other fields are optional and have defaults.

# ============================================================================
# CORE PATHS (REQUIRED)
# ============================================================================
bids_dir: /path/to/bids/dataset
output_dir: /path/to/output/derivatives

# Optional: Working directory for temporary files
# If not specified, defaults to output_dir/work
work_dir: /path/to/work

# ============================================================================
# SUBJECT/SESSION SELECTION
# ============================================================================
# Process specific participants (leave empty for all)
# Can be single value or list
participant_label:
  - sub-01
  - sub-02
  - sub-03

# Process specific sessions (leave empty for all)
# session_label:
#   - ses-01
#   - ses-baseline

# ============================================================================
# COMPUTATIONAL RESOURCES
# ============================================================================
n_cpus: 8                  # Number of CPUs to use
memory_gb: 16.0            # Memory limit in GB
use_gpu: false             # Enable GPU acceleration (if available)

# ============================================================================
# EXECUTION CONTROL
# ============================================================================
skip_existing: true        # Skip already-processed subjects
stop_on_error: false       # Stop pipeline on first error (true) or continue (false)

# ============================================================================
# LOGGING
# ============================================================================
log_level: INFO            # DEBUG, INFO, WARNING, ERROR
debug: false               # Enable debug mode
verbose: true              # Enable verbose output

# ============================================================================
# STUDY TRACKER
# ============================================================================
tracker:
  enabled: false           # Enable study tracker updates
  file: /path/to/study_tracker.xlsx

# Optional: legacy tracker file path (only used if tracker.enabled is true)
# tracker_file: /path/to/study_tracker.xlsx

# ============================================================================
# IMPORT / DICOM CONVERSION
# ============================================================================
# Optional import-time GE gradient nonlinearity metadata enrichment.
# This reads representative GE DICOMs once and stores the derived isocenter
# offset in each DWI JSON sidecar so later processing does not need the DICOMs.
#
# import:
#   method: dcm2bids            # Options: dcm2bids, dcm2niix
#   dcm2bids:
#     config_file: /path/to/bids/code/dcm2bids_config.json
#   metadata_overrides:
#     enabled: true
#     stop_on_mismatch: true
#     rules:
#       - match:
#           entities:
#             acq: spgr
#         metadata:
#           FlipAngle: [4, 8, 12, 16]
#       - match:
#           entities:
#             acq: ssfp
#         metadata:
#           FlipAngle: [10, 20, 30, 40]
#           PhaseCycling: [0, 180, 0, 180]
#       - match:
#           entities:
#             acq: afi
#         metadata:
#           TRRatio: 5.0
#   gradient_overrides:
#     enabled: true
#     require_both: true
#     stop_on_mismatch: true
#     rules:
#       - match:
#           json_fields:
#             SeriesDescription: dw500_pe0_out
#         bval: /path/to/correct/pe0_out.bval
#         bvec: /path/to/correct/pe0_out.bvec
#   gnl_metadata:
#     enabled: true
#     manufacturer: GE

# ============================================================================
# DMRI PIPELINE CONFIGURATION
# ============================================================================
dmri:
  # Optional input selection and partitioning. Each selected acquisition group
  # runs through preprocessing and modeling independently.
  # inputs:
  #   select:
  #     acq: prisma          # Process only this acquisition (a list is also accepted)
  #   separate_by: acq
  # For legacy raw desc-prisma/desc-trio names, use separate_by: desc and
  # preserve_group_as: acq because desc is replaced by derivative descriptions.

  # Preprocessing steps
  preprocessing:
    # Optional: rerun this step and all later preprocessing steps even when
    # skip_existing is true. Aliases: force_from_step, start_at_step,
    # resume_from_step. Examples: denoise, gibbs, distcorr, eddy, bias,
    # coregistration, brain_masking.
    rerun_from_step: null

    # Denoising
    denoising:
      enabled: true
      method: mppca          # Options: mppca, nlmeans
      parameters:
        patch_radius: 2
        
    # Gibbs ringing removal
    degibbs:
      enabled: true
      
    # Eddy current and motion correction
    eddy:
      enabled: true
      use_gpu: false         # Use GPU-accelerated eddy if available
      parameters:
        repol: true          # Replace outliers
        data_is_shelled: true

    # Unified motion/eddy backend. Existing configurations may omit this and
    # continue to use `eddy.enabled` above. Options: eddy, tortoise_v4, ants,
    # ants_native, niifreeze, none.
    motion_correction:
      method: eddy
      reference_selection:
        enabled: false       # Set true to choose a TORTOISE-like optimal b0
        method: native
        b0_threshold: 50
        local_radius: 3

      # TORTOISEV4 consumes the DWI produced by all earlier pipeline steps.
      tortoise_v4:
        correction_mode: quadratic  # motion, eddy_only, quadratic, or cubic
        slice_to_volume: true
        repol: true
        niter: 3
        use_gpu: false
        do_qc: true
        # executable: /opt/tortoise/bin/TORTOISEProcess
        options: {}

      # ANTs rigid-body motion correction. The bvec for each volume is rotated
      # from the estimated transform using finite-strain decomposition.
      ants:
        slice_to_volume: false
        transform_type: Rigid
        interpolator: linear
        registration_options: {}

      # Experimental local TORTOISE-like implementation: ANTs affine
      # motion/eddy registration plus slice-wise intra-volume refinement.
      native:
        slice_to_volume: true
        transform_type: Affine
        interpolator: linear
        registration_options: {}
        
    # Bias field correction
    bias_correction:
      enabled: true
      method: ants           # Options: ants, fsl

    # With a SuperSynth reference, both the anatomical fixed image and DWI
    # mean-b0 moving image are synthesized before registration. The transform
    # is then applied to the original DWI on the requested output grid.
    coregistration:
      enabled: false
      method: ants
      reference_image: supersynth  # Or supersynth_multivariate with ANTs
      options:
        output_resolution: anatomical
        transform_type: Rigid
        interpolation: linear
        # Strip both synthetic registration proxies only; the transform is
        # still applied to the original DWI and anatomical images.
        skull_strip_registration: false
        skull_strip_method: synthstrip
        skull_strip_moving: true
        skull_strip_fixed: true

    # Gradient nonlinearity correction
    # For the new GE-native workflow:
    # - set method: native_ge
    # - provide the GE coefficient file
    # - enable import.gnl_metadata so sidecars contain the GE isocenter offset
    grad_nonlin:
      enabled: false
      method: native_ge      # Options: native_ge, tortoise
      coeff_file: /path/to/gw_coils_magnus.dat
      
    # Susceptibility distortion correction
    # Workflow code uses `distcorr`; `topup+drbuddi` runs Topup pre-merge and
    # a native DRBUDDI-like reverse-PE refinement after Eddy.
    distcorr:
      method: topup          # Options: none, topup, synb0, drbuddi, topup+drbuddi
      fallback: true
      config: /apps/fsl-6.0.7.13/x86_64_al9/fsl/etc/flirtsch/b02b0_1.cnf
      # Synb0 prefers an acquired T1w. If only another undistorted anatomical
      # contrast is available, SuperSynth creates the T1w used by Synb0.
      # `anatomical_input` can select its BIDS suffix (for example T2w/FLAIR).
      # With registration: supersynth, matched synthetic T1w images are created
      # from both the anatomical moving image and DWI b0 fixed image. They are
      # used only to estimate the registration transforms.
      synb0:
        anatomical_input: auto
        # VFA/SPGR/SSFP series are averaged by default. To select one volume:
        # anatomical_series_mode: representative
        # anatomical_series_index: 0
        registration: direct  # Options: direct, supersynth
        registration_backend: fsl  # Options: fsl, ants
        # Estimate transforms from brain-only images, then apply them to the
        # original non-skull-stripped images used by Synb0.
        skull_strip_registration: false
        skull_strip_method: synthstrip
      drbuddi:
        transform_type: SyNOnly
        interpolator: linear
        symmetric_pairwise: true
        pe_axis_constraint: 1.0
        registration_options: {}
      
  # Modeling steps
  modeling:
    grad_nonlin:
      enabled: false
      method: native_ge      # Options: native_ge, tortoise
      coeff_file: /path/to/gw_coils_magnus.dat

    # Diffusion tensor imaging
    tensor:
      enabled: true
      metrics:
        - fa                 # Fractional anisotropy
        - md                 # Mean diffusivity
        - rd                 # Radial diffusivity
        - ad                 # Axial diffusivity
        - l1                 # Principal eigenvalue
        - l2                 # Second eigenvalue
        - l3                 # Third eigenvalue
        - v1                 # Principal eigenvector
        - v2                 # Second eigenvector
        - v3                 # Third eigenvector
        - tensor_mrtrix      # MRtrix-oriented tensor image for mrview
        
    # Constrained spherical deconvolution
    csd:
      enabled: true
      method: msmt_csd       # Options: csd, msmt_csd
      lmax: 8                # Maximum spherical harmonic degree
      
    # NODDI (Neurite Orientation Dispersion and Density Imaging)
    noddi:
      enabled: false

    # SANDI-AMICO (paper-matched dictionary; units are um and um^2/ms)
    sandi:
      enabled: false
      method: amico
      parameters:
        soma_diffusivity: 3.0
        soma_radii: [1.0, 3.8, 6.6, 9.4, 12.2, 15.0]
        neurite_diffusivities: [0.25, 1.1666666667, 2.0833333333, 3.0]
        extra_diffusivities: [0.25, 0.9375, 1.625, 2.3125, 3.0]
        l1_regularization: 0.0
        l2_regularization: 0.00075

    # Four-compartment Microglia model (dmipy SI units)
    microglia:
      enabled: false
      method: dmipy
      parameters:
        parallel_diffusivity: 1.0e-9  # m^2/s; published restricted diffusivity
        iso_diffusivity: 3.0e-9       # m^2/s
        small_diameter: 8.0e-6        # m; initialized within [5, 11] um
        large_diameter: 16.0e-6       # m; initialized within [12, 18] um
        small_diameter_bounds: [5.0e-6, 11.0e-6]
        large_diameter_bounds: [12.0e-6, 18.0e-6]
        Ns: 5
        N_sphere_samples: 30
        maxiter: 300
        # Sphere fitting also requires small-delta and big-Delta timing files
        # containing one value or one value per DWI volume, in seconds. These
        # are normally discovered from the DWI input metadata.

    # NEXI (Neurite Exchange Imaging)
    nexi:
      enabled: false
      td_file: /path/to/td.txt
      lowb_noisemap: /path/to/lowb_noisemap.nii.gz
      metrics:
        - t_ex
        - di
        - de
        - f
        - sigma
      
    # Tractography
    tractography:
      mrtrix:
        enabled: false
        algorithm: iFOD2       # iFOD2, SD_STREAM, Tensor_Det, Tensor_Prob
        select: 10000000
        cutoff: 0.06
        act:
          enabled: true
          algorithm: fsl       # 5ttgen backend when an existing 5TT is unavailable
          seed_gmwmi: true
          backtrack: true
          crop_at_gmwmi: true
        filtering:
          method: sift2        # none, sift, sift2
      tractseg:
        enabled: false
        options:
          preprocess: true
          bundles: [CST_L, CST_R]
      pyafq:
        enabled: false
      tract_specific:
        enabled: false
        bundles:
          - name: CST_L
            source: tractseg
          - name: CST_R
            source: tractseg
        metrics: [DTI.FA, DTI.MD]
        track_density:
          enabled: true
      
  # Quality control
  qc:
    enabled: true
    generate_reports: true
    compute_snr: true
    motion_threshold: 2.0    # mm of motion to flag as problematic

