bids_dir: /path/to/bids
output_dir: /path/to/derivatives/qmri-neuropipe
n_cpus: 8
skip_existing: true

dmri:
  modeling:
    csd:
      enabled: true
      method: msmt_csd
      lmax: 8
    dti:
      enabled: true
      method: dipy
      metrics: [fa, md, ad, rd]
    tractography:
      mrtrix:
        enabled: true
        algorithm: iFOD2
        select: 10000000
        cutoff: 0.06
        minlength: 10
        maxlength: 250
        act:
          enabled: true
          algorithm: fsl
          # Use "t1w" (default) or "supersynth" for 5ttgen.
          anatomical_source: supersynth
          supersynth:
            # auto prefers T1w then T2w; dwi generates SuperSynth from the mean b0.
            input: dwi
            mode: invivo
            device: cpu
            sharpen_synths: false
            b0_threshold: 50
          validate: true
          seed_gmwmi: true
          backtrack: true
          crop_at_gmwmi: true
        filtering:
          method: sift2
        tdi:
          enabled: true
          # Also write a map divided by sum(SIFT2 weights), or by streamline
          # count when SIFT2 weights are not used.
          normalize: true
          use_sift2_weights: true
          options:
            precise: true
      tractseg:
        enabled: true
        options:
          preprocess: true
          bundles: [CST_L, CST_R, AF_L, AF_R]
      tract_specific:
        enabled: true
        bundles:
          - {name: CST_L, source: tractseg}
          - {name: CST_R, source: tractseg}
          - {name: AF_L, source: tractseg}
          - {name: AF_R, source: tractseg}
        metrics: [DTI.FA, DTI.MD]
        streamline_statistic: mean
        profiles:
          enabled: true
          nodes: 100
        track_density:
          enabled: true
        connectome:
          enabled: false
          nodes: /path/to/dwi-space_parcellation.nii.gz
          use_sift2: true
