name = "qmri-neuropipe"
version = "0.0.1"
dependencies = ["typer>=0.12","pydra>=0.23","rich>=13.7","pydantic>=2.5","pandas>=2.2","pyyaml>=6.0"]
[project.scripts]
qmri-neuropipe = "qmri_neuropipe.cli:app"
