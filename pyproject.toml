
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmri-neuropipe"
version = "0.0.1"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.5",
    "pandas>=2.2",
    "pyyaml>=6.0", 
    "jinja2>=3.1", 
    "matplotlib>=3.8", 
    "antspyx>=0.3", 
    "dmipy>=1.0",
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "dipy>=1.8",
    "tensorflow>=2.15"
]
[project.scripts]
qmri-neuropipe = "qmri_neuropipe.cli:app"
qmri-tools = "qmri_neuropipe.tools:app"

[tool.setuptools.package-data]
"qmri_neuropipe.lib.reporting" = ["*.html"]
"qmri_neuropipe.lib.dmri" = ["data/*"]
