
[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmri-neuropipe"
version = "0.0.1"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=1.5",
    "pyyaml>=6.0", 
    "jinja2>=3.1", 
    "matplotlib>=3.8", 
    "antspyx>=0.3", 
    "dmipy>=1.0",
    "setuptools>=68,<82",
    "nibabel>=5.0",
    "numpy>=1.24,<2.0",
    "numba",
    "scipy>=1.10",
    "dipy>=1.8",
    "pywavelets",
    "pydicom>=2.4",
    "threadpoolctl",
    "tqdm",
    "dcm2bids"
]

[project.optional-dependencies]
amico = [
    "dmri-amico"
]
nexi = [
    "nexi"
]
nifreeze = [
    "nifreeze"
]
pyafq = [
    "pyAFQ"
]
hdbet = [
    "HD-BET",
    "imagecodecs>=2023.9.18"
]
mriqc = [
    "mriqc>=24.0.0; python_version<'3.12'"
]
synb0 = [
    "tensorflow>=2.21,<2.22; python_version>='3.10' and python_version<'3.14'"
]
tracker = [
    "openpyxl",
    "plotly",
    "streamlit"
]
reporting = [
    "weasyprint"
]
viewer = [
    "dash",
    "plotly",
    "pywebview"
]
print3d = [
    "scikit-image"
]
all = [
    "dmri-amico",
    "nexi",
    "HD-BET",
    "imagecodecs>=2023.9.18",
    "openpyxl",
    "plotly",
    "pyAFQ",
    "streamlit",
    "weasyprint",
    "dash",
    "pywebview",
    "scikit-image",
    "tensorflow>=2.21,<2.22; python_version>='3.10' and python_version<'3.14'"
]
[project.scripts]
qmri-neuropipe = "qmri_neuropipe.cli:app"
qmri-tools = "qmri_neuropipe.tools:app"
qneuro-condor = "qmri_neuropipe.examples.condor.qneuro_condor:console_main"
qneuro-container = "qmri_neuropipe.container_runner:console_main"

[tool.setuptools.package-data]
"qmri_neuropipe.lib.reporting" = ["*.html"]
"qmri_neuropipe.lib.dmri" = ["data/*"]
