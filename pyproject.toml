
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmri-neuropipe"
version = "0.0.1"
dependencies = ["typer>=0.12","rich>=13.7","pydantic>=2.5","pandas>=2.2","pyyaml>=6.0", "jinja2>=3.1", "matplotlib>=3.8", "antspyx>=0.3"]
[project.scripts]
qmri-neuropipe = "qmri_neuropipe.cli:app"

[tool.setuptools.package-data]
"qmri_neuropipe.lib.reporting" = ["*.html"]
"qmri_neuropipe.lib.dmri" = ["data/*"]
