
[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmri-neuropipe"
dynamic = ["version"]
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=1.5",
    "pyyaml>=6.0", 
    "jinja2>=3.1", 
    "matplotlib>=3.8", 
    "antspyx>=0.3", 
    "dmipy-fit>=2.1,<2.2",
    "nibabel>=5.0",
    "numpy>=2.0,<3",
    "numba",
    "scipy>=1.10",
    "dipy>=1.8",
    "pywavelets",
    "pydicom>=2.4",
    "threadpoolctl",
    "tqdm",
    "dcm2bids"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
dmipy-jax = [
    "dmipy-fit[jax]>=2.1,<2.2"
]
dmipy-cuda12 = [
    "dmipy-fit[jax-gpu]>=2.1,<2.2"
]
dmipy-legacy = [
    "dmipy-fit[legacy]>=2.1,<2.2"
]
amico = [
    "dmri-amico"
]
nexi = [
    "nexi"
]
nifreeze = [
    "nifreeze"
]
pyafq = [
    "pyAFQ"
]
hdbet = [
    "HD-BET",
    "imagecodecs>=2023.9.18"
]
antspynet = [
    "antspynet>=0.3.2,<0.4"
]
tractseg = [
    "TractSeg>=2.10,<2.11",
    # TractSeg uses PyTorch but does not declare it in its wheel metadata.
    "torch>=2.0"
]
mriqc = [
    "mriqc>=24.0.0; python_version<'3.12'"
]
synb0 = [
    "tensorflow>=2.21,<2.22; python_version>='3.10' and python_version<'3.14'"
]
tracker = [
    "openpyxl",
    "plotly",
    "streamlit"
]
reporting = [
    "weasyprint"
]
viewer = [
    "dash",
    "plotly",
    "pywebview"
]
print3d = [
    "scikit-image"
]
all = [
    "dmri-amico",
    "nexi",
    "HD-BET",
    "imagecodecs>=2023.9.18",
    "antspynet>=0.3.2,<0.4",
    "TractSeg>=2.10,<2.11",
    "torch>=2.0",
    "openpyxl",
    "plotly",
    "pyAFQ",
    "streamlit",
    "weasyprint",
    "dash",
    "pywebview",
    "scikit-image",
    "tensorflow>=2.21,<2.22; python_version>='3.10' and python_version<'3.14'"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F823"]

[project.scripts]
qmri-neuropipe = "qmri_neuropipe.cli:app"
qmri-tools = "qmri_neuropipe.tools:app"
qneuro-condor = "qmri_neuropipe.examples.condor.qneuro_condor:console_main"

[tool.setuptools.package-data]
"qmri_neuropipe.lib.reporting" = ["*.html"]
"qmri_neuropipe.lib.dmri" = ["data/*"]

[tool.setuptools.dynamic]
version = {attr = "qmri_neuropipe.__version__"}
